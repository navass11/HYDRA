<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc" font-family="Avenir Next,Segoe UI,Arial,sans-serif"><title id="title">Corrección de sesgo climático</title><desc id="desc">Tres series de entrada, elección de método, escenarios corregidos y controles de calidad.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#197b80"/></marker></defs><rect width="1500" height="650" fill="#f8fbfa"/><text x="30" y="38" font-size="28" fill="#173b45" font-weight="700">Tres entradas con una referencia histórica común</text><g><rect x="30" y="65" width="460" height="120" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="50" y="101" font-size="27" fill="#173b45" font-weight="700">Observaciones</text><text x="50" y="138" font-size="23" fill="#45636a" font-weight="400">Referencia y período de calibración</text></g><g><rect x="520" y="65" width="460" height="120" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="540" y="101" font-size="27" fill="#173b45" font-weight="700">Modelo · histórico</text><text x="540" y="138" font-size="23" fill="#45636a" font-weight="400">Comparación con la referencia</text></g><g><rect x="1010" y="65" width="460" height="120" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="1030" y="101" font-size="27" fill="#173b45" font-weight="700">Modelo · futuro</text><text x="1030" y="138" font-size="23" fill="#45636a" font-weight="400">Escenario y horizonte de estudio</text></g><path d="M260 187 L260 218" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750 187 L750 218" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1240 187 L1240 218" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="252" font-size="28" fill="#173b45" font-weight="700">Transformación elegida según variable y objetivo</text><g><rect x="30" y="275" width="700" height="115" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="50" y="311" font-size="27" fill="#173b45" font-weight="700">Delta</text><text x="50" y="348" font-size="23" fill="#45636a" font-weight="400">Cambios mensuales: aditivos o multiplicativos</text></g><g><rect x="760" y="275" width="710" height="115" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="780" y="311" font-size="27" fill="#173b45" font-weight="700">Distribuciones · EQM / QDM / SDM</text><text x="780" y="348" font-size="23" fill="#45636a" font-weight="400">Corrección de cuantiles; tratamiento de la señal de cambio</text></g><path d="M750 397 L750 426" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="435" width="1440" height="77" fill="#dcece8"/><text x="52" y="468" font-size="28" fill="#173b45" font-weight="700">Salida: escenarios corregidos y documentados</text><text x="52" y="498" font-size="23" fill="#45636a" font-weight="400">Modelo, variable, referencia, período, método, escenario y horizonte</text><text x="30" y="561" font-size="27" fill="#173b45" font-weight="700">Comprobar antes de propagar</text><text x="30" y="598" font-size="25" fill="#45636a" font-weight="400">Medias · frecuencia de precipitación · extremos · coherencia de la señal de cambio</text><text x="30" y="633" font-size="23" fill="#45636a" font-weight="400">La corrección de sesgo no elimina la incertidumbre climática.</text></svg>