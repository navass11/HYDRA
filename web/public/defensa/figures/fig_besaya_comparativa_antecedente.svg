<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
<title id="title">Besaya: comparación con el diseño basado en un evento único</title><desc id="desc">El TFM de 2017 y su publicación de 2018 comparan una cadena de múltiples hidrogramas e impactos con un esquema de evento único cuyo período se fija en el forzamiento. La frecuencia del calado se estima después de simular los impactos.</desc>
<rect width="1800" height="760" rx="12" fill="#f8fbfa"/><g font-family="Arial,sans-serif" fill="#183f48">
<rect x="40" y="24" width="850" height="76" rx="8" fill="#deeeea"/><text x="60" y="74" font-size="34" font-weight="700">2017</text><text x="165" y="71" font-size="29">TFM del Besaya: cadena estocástica completa</text>
<rect x="910" y="24" width="850" height="76" rx="8" fill="#deeeea"/><text x="930" y="74" font-size="34" font-weight="700">2018</text><text x="1035" y="71" font-size="29">Publicación en Revista de Obras Públicas</text>
<rect x="40" y="128" width="310" height="78" fill="#d4e6e3"/><text x="60" y="178" font-size="31" font-weight="700">Aspecto</text>
<rect x="350" y="128" width="700" height="78" fill="#d4e6e3"/><text x="370" y="178" font-size="31" font-weight="700">Diseño con evento único</text>
<rect x="1050" y="128" width="710" height="78" fill="#d4e6e3"/><text x="1070" y="178" font-size="31" font-weight="700">Enfoque estocástico del Besaya</text>
<rect x="40" y="206" width="1720" height="126" fill="#fff"/><path d="M40 332H1760" stroke="#bed3ce"/>
<text x="60" y="272" font-size="31" font-weight="700">Eventos</text>
<text x="370" y="255" font-size="29">Un evento o hidrograma de diseño</text>
<text x="370" y="294" font-size="29">con período de retorno de entrada</text>
<text x="1070" y="255" font-size="29">Múltiples hidrogramas plausibles</text>
<text x="1070" y="294" font-size="29">con pico, volumen y duración relacionados</text>
<rect x="40" y="332" width="1720" height="126" fill="#edf4f2"/><path d="M40 458H1760" stroke="#bed3ce"/>
<text x="60" y="398" font-size="31" font-weight="700">Cálculo físico</text>
<text x="370" y="381" font-size="29">Respuesta hidráulica</text>
<text x="370" y="420" font-size="29">para el evento seleccionado</text>
<text x="1070" y="381" font-size="29">Iber transforma los hidrogramas</text>
<text x="1070" y="420" font-size="29">en un conjunto de impactos</text>
<rect x="40" y="458" width="1720" height="126" fill="#fff"/><path d="M40 584H1760" stroke="#bed3ce"/>
<text x="60" y="524" font-size="31" font-weight="700">Frecuencia</text>
<text x="370" y="507" font-size="29">El período se fija en el forzamiento</text>
<text x="370" y="546" font-size="29">y guía la situación de diseño</text>
<text x="1070" y="507" font-size="29">Se estima sobre los calados resultantes</text>
<text x="1070" y="546" font-size="29">después de la simulación hidráulica</text>
<rect x="40" y="610" width="1720" height="70" rx="6" fill="#183f48"/><text x="65" y="655" font-size="31" font-weight="700" fill="#fff">El período de retorno del forzamiento no se traslada directamente al impacto.</text>
<text x="40" y="721" font-size="28">Límite operativo del antecedente: conexiones manuales y configuración específica para una cuenca.</text>
</g></svg>
