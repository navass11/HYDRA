<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">Despliegue público en Azure y entorno propio de proyecto</title><desc id="desc">Arriba, código e imágenes se publican en Azure para ofrecer documentación, herramientas y notebooks. Abajo, el usuario obtiene el repositorio y configura Docker Compose y volúmenes propios para trabajar con sus proyectos.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#387b80"/></marker></defs><rect x="1" y="1" width="1598" height="718" rx="12" fill="#fff" stroke="#cadcda"/><g font-family="Arial, sans-serif" fill="#203d47"><text x="48" y="53" font-size="29" font-weight="700" fill="#346f73">Plataforma pública · facilitar el acceso a HYDRA</text><rect x="48" y="78" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="66" y="116" font-size="25" font-weight="700" fill="#203d47">GitHub</text><text x="66" y="151" font-size="22" font-weight="400" fill="#203d47">Código y versiones</text><text x="66" y="182" font-size="22" font-weight="400" fill="#203d47">del software</text><path d="M397 144h29" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="436" y="78" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="454" y="116" font-size="25" font-weight="700" fill="#203d47">Imágenes Docker</text><text x="454" y="151" font-size="22" font-weight="400" fill="#203d47">Construcción</text><text x="454" y="182" font-size="22" font-weight="400" fill="#203d47">con dependencias</text><path d="M785 144h29" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="824" y="78" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="842" y="116" font-size="25" font-weight="700" fill="#203d47">Registro de imágenes</text><text x="842" y="151" font-size="22" font-weight="400" fill="#203d47">Azure Container Registry</text><text x="842" y="182" font-size="22" font-weight="400" fill="#203d47">Versiones identificables</text><path d="M1173 144h29" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1212" y="78" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="1230" y="116" font-size="25" font-weight="700" fill="#203d47">Azure Container Apps</text><text x="1230" y="151" font-size="22" font-weight="400" fill="#203d47">Web y API</text><text x="1230" y="182" font-size="22" font-weight="400" fill="#203d47">JupyterLab</text><text x="48" y="255" font-size="26" font-weight="700" fill="#203d47">Documentación · herramientas interactivas · casos y notebooks</text><text x="48" y="294" font-size="23" font-weight="400" fill="#203d47">Datos y sesiones persistentes en Azure Files · infraestructura compartida</text><path d="M48 328H1552" stroke="#cadcda"/><text x="48" y="380" font-size="29" font-weight="700" fill="#346f73">Entorno propio · trabajar con los proyectos del usuario</text><rect x="48" y="405" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="66" y="443" font-size="25" font-weight="700" fill="#203d47">Obtener el repositorio</text><text x="66" y="478" font-size="22" font-weight="400" fill="#203d47">Elegir una versión</text><text x="66" y="509" font-size="22" font-weight="400" fill="#203d47">de HYDRA</text><path d="M397 471h29" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="436" y="405" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="454" y="443" font-size="25" font-weight="700" fill="#203d47">Docker Compose</text><text x="454" y="478" font-size="22" font-weight="400" fill="#203d47">Construir y levantar</text><text x="454" y="509" font-size="22" font-weight="400" fill="#203d47">los servicios</text><path d="M785 471h29" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="824" y="405" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="842" y="443" font-size="25" font-weight="700" fill="#203d47">Contenedores propios</text><text x="842" y="478" font-size="22" font-weight="400" fill="#203d47">Web, API y JupyterLab</text><text x="842" y="509" font-size="22" font-weight="400" fill="#203d47">En equipo o servidor</text><path d="M1173 471h29" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1212" y="405" width="340" height="132" rx="8" fill="#eff6f4" stroke="#9dbfbb"/><text x="1230" y="443" font-size="25" font-weight="700" fill="#203d47">Proyecto del usuario</text><text x="1230" y="478" font-size="22" font-weight="400" fill="#203d47">Datos, modelos y resultados</text><text x="1230" y="509" font-size="22" font-weight="400" fill="#203d47">en volúmenes propios</text><text x="48" y="583" font-size="26" font-weight="700" fill="#203d47">Plataforma completa o solo JupyterLab + pyhydra para ejecutar notebooks</text><text x="48" y="625" font-size="23" font-weight="400" fill="#203d47">Solo notebooks: sin web ni API · En ambas opciones: datos y resultados en volúmenes.</text><rect x="30" y="658" width="1540" height="42" rx="6" fill="#dcebea"/><text x="49" y="686" font-size="23" font-weight="700" fill="#203d47">Una sesión en la web pública no equivale a desplegar una instalación propia.</text></g></svg>