<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Publicación del software y ejecución de notebooks</title><desc id="desc">La publicación pasa de GitHub al proceso de construcción, registro de imágenes y Azure. El uso de notebooks pasa del usuario a la API, a una copia de trabajo y a JupyterLab. El espacio de trabajo no implica un contenedor exclusivo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#387b80" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="1598" height="758" rx="18" fill="#fff" stroke="#cadcda"/><g font-family="Arial, sans-serif" fill="#203d47"><text x="55" y="67" font-size="30" font-weight="700">Dos recorridos con responsabilidades distintas</text><text x="55" y="125" font-size="28" font-weight="700" fill="#346f73">Publicar una versión del software</text><rect x="55" y="152" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="75" y="190" font-size="26" font-weight="700" fill="#203d47">GitHub</text><text x="75" y="226" font-size="22" font-weight="400" fill="#203d47">Código versionado</text><path d="M394 214h35" fill="none" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="152" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="460" y="190" font-size="26" font-weight="700" fill="#203d47">Construcción</text><text x="460" y="226" font-size="22" font-weight="400" fill="#203d47">Imagen con dependencias</text><path d="M779 214h35" fill="none" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="825" y="152" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="845" y="190" font-size="26" font-weight="700" fill="#203d47">Registro de imágenes</text><text x="845" y="226" font-size="22" font-weight="400" fill="#203d47">Versión identificable</text><path d="M1164 214h35" fill="none" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1210" y="152" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="1230" y="190" font-size="26" font-weight="700" fill="#203d47">Azure</text><text x="1230" y="226" font-size="22" font-weight="400" fill="#203d47">Web y servicios</text><text x="55" y="328" font-size="24" font-weight="400" fill="#203d47">Datos y resultados que deban conservarse → almacenamiento persistente</text><path d="M55 366H1545" stroke="#cadcda"/><text x="55" y="416" font-size="28" font-weight="700" fill="#346f73">Abrir y ejecutar un notebook</text><rect x="55" y="443" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="75" y="481" font-size="26" font-weight="700" fill="#203d47">Usuario</text><text x="75" y="517" font-size="22" font-weight="400" fill="#203d47">Selecciona un caso</text><path d="M394 505h35" fill="none" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="443" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="460" y="481" font-size="26" font-weight="700" fill="#203d47">API de notebooks</text><text x="460" y="517" font-size="22" font-weight="400" fill="#203d47">Prepara la apertura</text><path d="M779 505h35" fill="none" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="825" y="443" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="845" y="481" font-size="26" font-weight="700" fill="#203d47">Espacio de trabajo</text><text x="845" y="517" font-size="22" font-weight="400" fill="#203d47">Copia del notebook</text><path d="M1164 505h35" fill="none" stroke="#387b80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1210" y="443" width="330" height="125" rx="10" fill="#eff6f4" stroke="#9dbfbb"/><text x="1230" y="481" font-size="26" font-weight="700" fill="#203d47">JupyterLab</text><text x="1230" y="517" font-size="22" font-weight="400" fill="#203d47">Ejecución del análisis</text><text x="55" y="619" font-size="24" font-weight="700" fill="#203d47">Espacio de trabajo ≠ contenedor exclusivo por usuario</text><text x="55" y="675" font-size="25" font-weight="400" fill="#203d47">Para repetir un resultado: datos + configuración + versiones + entorno de ejecución</text></g></svg>