<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t" font-family="Avenir Next, Avenir, Segoe UI, Helvetica, sans-serif">
  <title id="t">Evidencia que sostiene cada hipótesis</title>
  <defs><g id="col" fill="#0E4A57"><circle cx="0" cy="31" r="6"/><circle cx="0" cy="48" r="6"/><circle cx="0" cy="65" r="6"/><circle cx="0" cy="82" r="6"/><circle cx="0" cy="99" r="6"/><circle cx="0" cy="116" r="6"/><circle cx="0" cy="133" r="6"/><circle cx="0" cy="150" r="6"/><circle cx="0" cy="167" r="6"/></g></defs>

  <!-- H1 -->
  <text x="10" y="26" font-size="19" font-weight="600" fill="#13323A">H1 Automatización: campañas sin intervención manual</text>
  <g transform="translate(10 42)" fill="#13323A">
    <rect width="250" height="112" fill="#F8FBFA" stroke="#C6D8D4"/><rect width="250" height="5" fill="#3F8E93"/>
    <text x="16" y="52" font-size="38" font-weight="600" fill="#0E4A57">1.990</text>
    <text x="16" y="80" font-size="15">simulaciones hidráulicas</text><text x="16" y="99" font-size="14" fill="#4A6870">emparejadas (Besaya)</text>
    <g transform="translate(265 0)">
      <rect width="250" height="112" fill="#F8FBFA" stroke="#C6D8D4"/><rect width="250" height="5" fill="#3F8E93"/>
      <text x="16" y="52" font-size="38" font-weight="600" fill="#0E4A57">10.000</text>
      <text x="16" y="80" font-size="15">años sintéticos de lluvia</text><text x="16" y="99" font-size="14" fill="#4A6870">200 simulados en Iber (IAHR 2022)</text>
    </g>
    <g transform="translate(530 0)">
      <rect width="250" height="112" fill="#F8FBFA" stroke="#C6D8D4"/><rect width="250" height="5" fill="#3F8E93"/>
      <text x="16" y="52" font-size="38" font-weight="600" fill="#0E4A57">Miles</text>
      <text x="16" y="80" font-size="15">de eventos multisitio</text><text x="16" y="99" font-size="14" fill="#4A6870">selección y reconstrucción (Calle 30)</text>
    </g>
  </g>

  <!-- H2 -->
  <text x="10" y="196" font-size="19" font-weight="600" fill="#13323A">H2 Modularidad: los mismos bloques en nueve casos</text>
  <g transform="translate(10 210)" font-size="13.5" fill="#13323A">
    <g font-weight="600" fill="#4A6870" text-anchor="middle">
      <text x="430" y="14">Datos</text><text x="520" y="14">Clima</text><text x="610" y="14">Estocástica</text><text x="700" y="14">Modelado</text>
    </g>
    <g transform="translate(0 22)">
      <text y="14">Besaya</text><text y="31">Sant Llorenç</text><text y="48">Calle 30</text><text y="65">Valencia</text><text y="82">Tanganica</text>
      <text y="99">Andes</text><text y="116">IAHR 2022</text><text y="133">SIMPCCe</text><text y="150">Panamá</text>
    </g>
    <g fill="#0E4A57">
      <!-- Datos, Clima: all nine -->
      
      <use href="#col" x="430"/><use href="#col" x="520"/>
      <!-- Estocástica: Besaya, Sant Llorenç, Calle 30, IAHR -->
      <circle cx="610" cy="31" r="6"/><circle cx="610" cy="48" r="6"/><circle cx="610" cy="65" r="6"/><circle cx="610" cy="133" r="6"/>
      <!-- Modelado: all but Valencia -->
      <circle cx="700" cy="31" r="6"/><circle cx="700" cy="48" r="6"/><circle cx="700" cy="65" r="6"/><circle cx="700" cy="99" r="6"/><circle cx="700" cy="116" r="6"/><circle cx="700" cy="133" r="6"/><circle cx="700" cy="150" r="6"/><circle cx="700" cy="167" r="6"/>
    </g>
    
  </g>

  <!-- H3 -->
  <text x="10" y="418" font-size="19" font-weight="600" fill="#13323A">H3 Incertidumbre: el método cambia el diseño</text>
  <g transform="translate(10 434)" fill="#13323A">
    <text y="16" font-size="14" fill="#4A6870">Caudal de diseño T100, RCP4.5, 2011–2040 (m³/s)</text>
    <rect x="0" y="30" width="232" height="34" fill="#A9D2CC"/><text x="242" y="54" font-size="16">208,8 método IDF</text>
    <rect x="0" y="72" width="310" height="34" fill="#0E4A57"/><text x="12" y="96" font-size="16" font-weight="600" fill="#fff">278,5 cadena estocástica</text><text x="320" y="96" font-size="16" font-weight="600" fill="#0E4A57">+33 %</text>
    <g transform="translate(540 0)">
      <text y="16" font-size="14" fill="#4A6870">Cuantil T100 en Turís (mm)</text>
      <rect x="0" y="30" width="60" height="34" fill="#A9D2CC"/><text x="70" y="54" font-size="16">260 sin la DANA</text>
      <rect x="0" y="72" width="220" height="34" fill="#B5334B"/><text x="12" y="96" font-size="16" font-weight="600" fill="#fff">952 con la DANA</text>
    </g>
    <text y="146" font-size="14" fill="#4A6870">Barras a escala dentro de cada gráfico. Fuente: memoria, cap. 8.</text>
  </g>
</svg>
