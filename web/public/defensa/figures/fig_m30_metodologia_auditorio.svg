<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Proceso metodológico de Calle 30 Madrid</title><desc id="d">Cadena con selección en dos etapas, HEC-HMS y HEC-RAS 1D.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#5eead4"/></marker><linearGradient id="bg"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2030"/></linearGradient></defs><rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="55" y="66" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800" fill="#f8fafc">Calle 30: dos selecciones para hacer viable la cadena</text><text x="55" y="105" font-family="Inter,Arial,sans-serif" font-size="19" fill="#94a3b8">Primero se reduce la lluvia; después se seleccionan los hidrogramas que llegan a la hidráulica</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(45 155)"><rect width="210" height="140" rx="18" fill="#102a43" stroke="#38bdf8" stroke-width="2"/><text x="105" y="42" text-anchor="middle" fill="#7dd3fc" font-size="17" font-weight="800">1 · LLUVIA</text><text x="105" y="79" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="750">Multisitio</text><text x="105" y="109" text-anchor="middle" fill="#cbd5e1" font-size="16">GEV + cópulas</text></g>
    <g transform="translate(295 155)"><rect width="210" height="140" rx="18" fill="#20264a" stroke="#a78bfa" stroke-width="2"/><text x="105" y="42" text-anchor="middle" fill="#c4b5fd" font-size="17" font-weight="800">2 · PRESELECCIÓN</text><text x="105" y="79" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="750">Eventos de lluvia</text><text x="105" y="109" text-anchor="middle" fill="#cbd5e1" font-size="16">subconjunto inicial</text></g>
    <g transform="translate(545 155)"><rect width="210" height="140" rx="18" fill="#3b2710" stroke="#f59e0b" stroke-width="2"/><text x="105" y="42" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="800">3 · HIDROLOGÍA</text><text x="105" y="79" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">HEC-HMS</text><text x="105" y="109" text-anchor="middle" fill="#cbd5e1" font-size="16">lluvia → hidrogramas</text></g>
    <g transform="translate(795 155)"><rect width="210" height="140" rx="18" fill="#263018" stroke="#a3e635" stroke-width="2"/><text x="105" y="42" text-anchor="middle" fill="#bef264" font-size="17" font-weight="800">4 · MAXDISS</text><text x="105" y="79" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="750">Hidrogramas</text><text x="105" y="109" text-anchor="middle" fill="#cbd5e1" font-size="16">selección hidráulica</text></g>
    <g transform="translate(155 385)"><rect width="245" height="145" rx="18" fill="#3b2710" stroke="#f59e0b" stroke-width="2"/><text x="122" y="43" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="800">5 · HIDRÁULICA</text><text x="122" y="82" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="800">HEC-RAS 1D</text><text x="122" y="114" text-anchor="middle" fill="#cbd5e1" font-size="17">red de túneles</text></g>
    <g transform="translate(478 385)"><rect width="245" height="145" rx="18" fill="#162945" stroke="#818cf8" stroke-width="2"/><text x="122" y="43" text-anchor="middle" fill="#a5b4fc" font-size="17" font-weight="800">6 · RECONSTRUCCIÓN</text><text x="122" y="82" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="800">k-NN</text><text x="122" y="114" text-anchor="middle" fill="#cbd5e1" font-size="17">escenarios no simulados</text></g>
    <g transform="translate(800 385)"><rect width="245" height="145" rx="18" fill="#12342f" stroke="#34d399" stroke-width="2"/><text x="122" y="43" text-anchor="middle" fill="#6ee7b7" font-size="17" font-weight="800">7 · IMPACTO</text><text x="122" y="82" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">T(calado)</text><text x="122" y="114" text-anchor="middle" fill="#cbd5e1" font-size="17">frecuencia por píxel</text></g>
  </g>
  <g stroke="#5eead4" stroke-width="5" marker-end="url(#a)" fill="none"><path d="M262 225h25"/><path d="M512 225h25"/><path d="M762 225h25"/><path d="M900 305v42H278v28"/><path d="M408 458h60"/><path d="M731 458h59"/></g>
  <rect x="170" y="584" width="860" height="48" rx="24" fill="#0f3b3b" stroke="#2dd4bf"/><text x="600" y="615" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#ccfbf1">pyhydra enlaza las etapas y conserva la trazabilidad desde la lluvia hasta el impacto</text>
</svg>
