<text x="200" y="96" text-anchor="middle" font-size="26">Transformación lluvia–caudal</text>
<text x="200" y="131" text-anchor="middle" font-size="26">Caudales de entrada</text>
</g>
<g transform="translate(480 220)"><rect width="400" height="170" rx="7" fill="#fff2e2" stroke="#c89554" stroke-width="2"/><text x="200" y="47" text-anchor="middle" font-size="30" font-weight="700">Hidráulica · HEC-RAS 1D</text>
