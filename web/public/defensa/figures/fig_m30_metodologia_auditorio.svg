<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 610" role="img" aria-labelledby="title desc">
<title id="title">Calle 30: selección de lluvia y respuesta hidráulica 1D</title><desc id="desc">Precipitación, eventos, cópulas y lluvia sintética. MaxDiss selecciona eventos de lluvia antes de HEC-HMS. Los caudales alimentan HEC-RAS 1D con la geometría urbana. k-NN reconstruye calados y se estima su período de retorno por sección.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39767c"/></marker></defs>
<rect width="1800" height="610" rx="10" fill="#edf3f1"/><g font-family="Arial,sans-serif" fill="#183f48">
<g transform="translate(40 20)"><rect width="400" height="170" rx="7" fill="#e1edf1" stroke="#548792" stroke-width="2"/><text x="200" y="47" text-anchor="middle" font-size="30" font-weight="700">Precipitación</text>
<text x="200" y="96" text-anchor="middle" font-size="26">ERA5 + pluviómetros AEMET</text>
</g>
<g transform="translate(480 20)"><rect width="400" height="170" rx="7" fill="#f9fcfb" stroke="#82aaa8" stroke-width="2"/><text x="200" y="47" text-anchor="middle" font-size="30" font-weight="700">Eventos de lluvia</text>
<text x="200" y="96" text-anchor="middle" font-size="26">Duración, volumen, intensidad</text>
<text x="200" y="131" text-anchor="middle" font-size="26">Extremos GEV multiduración</text>
</g>
<g transform="translate(920 20)"><rect width="400" height="170" rx="7" fill="#f9fcfb" stroke="#82aaa8" stroke-width="2"/><text x="200" y="47" text-anchor="middle" font-size="30" font-weight="700">Cópulas multivariantes</text>
<text x="200" y="96" text-anchor="middle" font-size="26">Dependencia espacial</text>
<text x="200" y="131" text-anchor="middle" font-size="26">y temporal</text>
</g>
<g transform="translate(1360 20)"><rect width="400" height="170" rx="7" fill="#f9fcfb" stroke="#82aaa8" stroke-width="2"/><text x="200" y="47" text-anchor="middle" font-size="30" font-weight="700">Eventos sintéticos</text>
<text x="200" y="96" text-anchor="middle" font-size="26">Precipitación</text>
<text x="200" y="131" text-anchor="middle" font-size="26">en las subcuencas</text>
</g>
