</g>
<g transform="translate(480 420)"><rect width="400" height="170" rx="7" fill="#f9fcfb" stroke="#82aaa8" stroke-width="2"/><text x="200" y="47" text-anchor="middle" font-size="30" font-weight="700">Reconstrucción k-NN</text>
