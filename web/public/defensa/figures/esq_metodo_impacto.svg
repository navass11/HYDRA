<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc" font-family="Avenir Next,Segoe UI,Arial,sans-serif"><title id="title">Del ensemble a los mapas de período de retorno</title><desc id="desc">Selección MaxDiss, simulación física, reconstrucción k-NN, validación cruzada y estimación de frecuencia del impacto.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#197b80"/></marker></defs><rect width="1500" height="650" fill="#f8fbfa"/><text x="30" y="38" font-size="28" fill="#173b45" font-weight="700">Separar la generación de escenarios de la simulación física</text><g><rect x="30" y="70" width="264" height="165" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="50" y="106" font-size="27" fill="#173b45" font-weight="700">N escenarios</text><text x="50" y="143" font-size="23" fill="#45636a" font-weight="400">Descriptores</text><text x="50" y="178" font-size="23" fill="#45636a" font-weight="400">y frecuencia</text><text x="50" y="213" font-size="23" fill="#45636a" font-weight="400">del conjunto</text></g><path d="M297 145 L318 145" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="324" y="70" width="264" height="165" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="344" y="106" font-size="27" fill="#173b45" font-weight="700">MaxDiss</text><text x="344" y="143" font-size="23" fill="#45636a" font-weight="400">Selección que cubre</text><text x="344" y="178" font-size="23" fill="#45636a" font-weight="400">la variabilidad</text></g><path d="M591 145 L612 145" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="618" y="70" width="264" height="165" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="638" y="106" font-size="27" fill="#173b45" font-weight="700">n simulaciones</text><text x="638" y="143" font-size="23" fill="#45636a" font-weight="400">Motores hidrológicos</text><text x="638" y="178" font-size="23" fill="#45636a" font-weight="400">e hidráulicos</text></g><path d="M885 145 L906 145" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="912" y="70" width="264" height="165" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="932" y="106" font-size="27" fill="#173b45" font-weight="700">k-NN</text><text x="932" y="143" font-size="23" fill="#45636a" font-weight="400">Reconstruir desde</text><text x="932" y="178" font-size="23" fill="#45636a" font-weight="400">vecinos similares</text></g><path d="M1179 145 L1200 145" stroke="#197b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="1206" y="70" width="264" height="165" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="1226" y="106" font-size="27" fill="#173b45" font-weight="700">N mapas</text><text x="1226" y="143" font-size="23" fill="#45636a" font-weight="400">Impacto: calado</text><text x="1226" y="178" font-size="23" fill="#45636a" font-weight="400">y extensión</text><text x="1226" y="213" font-size="23" fill="#45636a" font-weight="400">por realización</text></g><text x="30" y="270" font-size="26" fill="#45636a" font-weight="400">n es un subconjunto de N; seleccionar no asigna probabilidades.</text><g><rect x="30" y="305" width="850" height="215" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="50" y="341" font-size="27" fill="#173b45" font-weight="700">Validar la reconstrucción</text><text x="50" y="378" font-size="23" fill="#45636a" font-weight="400">Excluir una simulación conocida y reconstruir su mapa.</text><text x="50" y="413" font-size="23" fill="#45636a" font-weight="400">Comparar con la simulación física reservada:</text><text x="50" y="448" font-size="23" fill="#45636a" font-weight="400">calado (RMSE / sesgo), extensión (CSI) y cuantiles altos.</text><text x="50" y="483" font-size="23" fill="#45636a" font-weight="400">Si la cobertura no basta: ampliar o revisar la selección.</text></g><g><rect x="910" y="305" width="560" height="215" rx="5" fill="#fff" stroke="#bad4cf" stroke-width="2"/><text x="930" y="341" font-size="27" fill="#173b45" font-weight="700">Estimar frecuencia por celda</text><text x="930" y="378" font-size="23" fill="#45636a" font-weight="400">Reunir el ensemble de impactos.</text><text x="930" y="413" font-size="23" fill="#45636a" font-weight="400">Conservar duración o pesos de ocurrencia.</text><text x="930" y="448" font-size="23" fill="#45636a" font-weight="400">Obtener calados para períodos de retorno.</text><text x="930" y="483" font-size="23" fill="#45636a" font-weight="400">La frecuencia se calcula sobre el impacto.</text></g><text x="30" y="570" font-size="27" fill="#173b45" font-weight="700">Dos comprobaciones diferentes</text><text x="30" y="608" font-size="26" fill="#45636a" font-weight="400">Reconstrucción frente a simulación física ≠ modelo frente a observaciones.</text></svg>