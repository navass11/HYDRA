<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="t d" font-family="Avenir Next,Segoe UI,Arial,sans-serif">
<title id="t">Limitaciones y mitigaciones de HYDRA, y tres ámbitos de trabajo futuro</title>
<desc id="d">Síntesis de la tabla 8.1 y los apartados 8.4 y 8.5 de la memoria. Se distinguen las medidas ya disponibles de los límites persistentes y las futuras extensiones.</desc>
<rect width="1600" height="650" fill="#f8fbfa"/>
<rect x="20" y="15" width="1560" height="55" fill="#dcebe7"/>
<text x="38" y="51" font-size="29" font-weight="700" fill="#0e4a57">Limitación</text>
<text x="430" y="51" font-size="29" font-weight="700" fill="#0e4a57">HYDRA incorpora</text>
<text x="1000" y="51" font-size="29" font-weight="700" fill="#0e4a57">Límite que permanece</text>
<rect x="20" y="74" width="1560" height="66" fill="#eef5f3"/>
<text x="38" y="101" font-size="25" fill="#173b45" font-weight="650">Series cortas o</text>
<text x="38" y="128" font-size="25" fill="#173b45" font-weight="650">extremos raros</text>
<text x="430" y="101" font-size="25" fill="#173b45">Bootstrap, Bayes y análisis</text>
<text x="430" y="128" font-size="25" fill="#173b45">de frecuencia regional</text>
<text x="1000" y="101" font-size="25" fill="#173b45">Información ausente; el AFR</text>
<text x="1000" y="128" font-size="25" fill="#173b45">requiere homogeneidad regional</text>
<path d="M20 140h1560" stroke="#c6d8d4"/>
<text x="38" y="167" font-size="25" fill="#173b45" font-weight="650">Motores externos</text>
<text x="430" y="167" font-size="25" fill="#173b45">Adaptadores normalizados</text>
<text x="430" y="194" font-size="25" fill="#173b45">y entorno Docker</text>
<text x="1000" y="167" font-size="25" fill="#173b45">Licencias, instalación</text>
<text x="1000" y="194" font-size="25" fill="#173b45">y versiones de los motores</text>
<path d="M20 206h1560" stroke="#c6d8d4"/>
<rect x="20" y="206" width="1560" height="66" fill="#eef5f3"/>
<text x="38" y="233" font-size="25" fill="#173b45" font-weight="650">Generadores</text>
<text x="38" y="260" font-size="25" fill="#173b45" font-weight="650">estacionarios</text>
<text x="430" y="233" font-size="25" fill="#173b45">Corrección de sesgo y</text>
<text x="430" y="260" font-size="25" fill="#173b45">generación por escenario</text>
<text x="1000" y="233" font-size="25" fill="#173b45">La no estacionariedad completa</text>
<text x="1000" y="260" font-size="25" fill="#173b45">requiere modelos específicos</text>
<path d="M20 272h1560" stroke="#c6d8d4"/>
<text x="38" y="299" font-size="25" fill="#173b45" font-weight="650">Coste de simulación</text>
<text x="38" y="326" font-size="25" fill="#173b45" font-weight="650">hidráulica</text>
<text x="430" y="299" font-size="25" fill="#173b45">MaxDiss, k-NN, GPR</text>
<text x="430" y="326" font-size="25" fill="#173b45">y selección con pyhydra.uq</text>
<text x="1000" y="299" font-size="25" fill="#173b45">Validación física y simulación</text>
<text x="1000" y="326" font-size="25" fill="#173b45">directa en casos no emulables</text>
<path d="M20 338h1560" stroke="#c6d8d4"/>
<rect x="20" y="338" width="1560" height="66" fill="#eef5f3"/>
<text x="38" y="365" font-size="25" fill="#173b45" font-weight="650">Calidad de los</text>
<text x="38" y="392" font-size="25" fill="#173b45" font-weight="650">datos globales</text>
<text x="430" y="365" font-size="25" fill="#173b45">Diagnóstico, corrección</text>
<text x="430" y="392" font-size="25" fill="#173b45">de sesgo y trazabilidad</text>
<text x="1000" y="365" font-size="25" fill="#173b45">Errores de representación en</text>
<text x="1000" y="392" font-size="25" fill="#173b45">cuencas complejas o con pocos datos</text>
<path d="M20 404h1560" stroke="#c6d8d4"/>
<text x="25" y="450" font-size="29" font-weight="700" fill="#0e4a57">Trabajo futuro · tres ámbitos (§8.5)</text>
<path d="M25 473h500" stroke="#3f8e93" stroke-width="5"/>
<text x="25" y="511" font-size="27" font-weight="700" fill="#173b45">Métodos y validación</text>
<text x="25" y="549" font-size="23" fill="#45636a">Validación en otras cuencas y modelos.</text>
<text x="25" y="581" font-size="23" fill="#45636a">No estacionariedad y eventos compuestos.</text>
<path d="M550 473h500" stroke="#3f8e93" stroke-width="5"/>
<text x="550" y="511" font-size="27" font-weight="700" fill="#173b45">Infraestructura</text>
<text x="550" y="549" font-size="23" fill="#45636a">Campañas en HPC o cloud.</text>
<text x="550" y="581" font-size="23" fill="#45636a">Configuración declarativa de estudios (YAML).</text>
<path d="M1075 473h500" stroke="#3f8e93" stroke-width="5"/>
<text x="1075" y="511" font-size="27" font-weight="700" fill="#173b45">Documentación y transferencia</text>
<text x="1075" y="549" font-size="23" fill="#45636a">Formación y pruebas de integración.</text>
<text x="1075" y="581" font-size="23" fill="#45636a">Continuidad de PyPI y versiones en Zenodo.</text>
<text x="25" y="631" font-size="22" fill="#45636a">Fuente: memoria doctoral, tabla 8.1 y §§8.4–8.5, pp. 128–130. Síntesis para la defensa.</text>
</svg>