<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
 <title id="t">Objetivos y evidencias de la tesis</title><desc id="d">Relación entre los cuatro objetivos específicos, sus desarrollos y las evidencias de validación.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#5eead4"/></marker><linearGradient id="bg"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2030"/></linearGradient></defs>
 <rect width="1100" height="720" rx="28" fill="url(#bg)"/>
 <text x="50" y="60" font-family="Inter,Arial" font-size="29" font-weight="850" fill="#f8fafc">De los objetivos a la evidencia</text>
 <text x="50" y="96" font-family="Inter,Arial" font-size="18" fill="#94a3b8">La validación no es genérica: cada objetivo deja un resultado comprobable</text>
 <g font-family="Inter,Arial">
  <text x="55" y="145" fill="#64748b" font-size="15" font-weight="800">OBJETIVO</text><text x="403" y="145" fill="#64748b" font-size="15" font-weight="800">DESARROLLO</text><text x="760" y="145" fill="#64748b" font-size="15" font-weight="800">EVIDENCIA</text>
  <g transform="translate(45 170)"><rect width="255" height="100" rx="16" fill="#102a43" stroke="#38bdf8" stroke-width="2"/><text x="22" y="35" fill="#7dd3fc" font-size="17" font-weight="800">OE1 · DATOS</text><text x="22" y="68" fill="#e2e8f0" font-size="18">Adquirir y homogeneizar</text></g>
  <g transform="translate(365 170)"><rect width="300" height="100" rx="16" fill="#0f2638" stroke="#38bdf8"/><text x="20" y="40" fill="#f8fafc" font-size="19" font-weight="750">Adaptadores y metadatos</text><text x="20" y="70" fill="#94a3b8" font-size="16">fuente · fecha · consulta · formato</text></g>
  <g transform="translate(730 170)"><rect width="325" height="100" rx="16" fill="#102c31" stroke="#34d399"/><text x="20" y="40" fill="#6ee7b7" font-size="18" font-weight="800">Procedencia registrada</text><text x="20" y="70" fill="#cbd5e1" font-size="16">entradas trazables y repetibles</text></g>
  <g transform="translate(45 292)"><rect width="255" height="100" rx="16" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="22" y="35" fill="#a5b4fc" font-size="17" font-weight="800">OE2 · MÉTODOS</text><text x="22" y="68" fill="#e2e8f0" font-size="18">Integrar incertidumbre</text></g>
  <g transform="translate(365 292)"><rect width="300" height="100" rx="16" fill="#1d2546" stroke="#818cf8"/><text x="20" y="32" fill="#f8fafc" font-size="19" font-weight="750"><tspan x="20">Extremos · dependencia</tspan><tspan x="20" dy="23">Clima</tspan></text><text x="20" y="80" fill="#94a3b8" font-size="16">métodos bajo una interfaz común</text></g>
  <g transform="translate(730 292)"><rect width="325" height="100" rx="16" fill="#102c31" stroke="#34d399"/><text x="20" y="40" fill="#6ee7b7" font-size="18" font-weight="800">Incertidumbre cuantificada</text><text x="20" y="70" fill="#cbd5e1" font-size="16">comparación entre estimadores</text></g>
  <g transform="translate(45 414)"><rect width="255" height="100" rx="16" fill="#12342f" stroke="#2dd4bf" stroke-width="2"/><text x="22" y="35" fill="#5eead4" font-size="17" font-weight="800">OE3 · IMPACTO</text><text x="22" y="68" fill="#e2e8f0" font-size="18">Acoplar modelos físicos</text></g>
  <g transform="translate(365 414)"><rect width="300" height="100" rx="16" fill="#103a3b" stroke="#2dd4bf"/><text x="20" y="40" fill="#f8fafc" font-size="19" font-weight="750">Hidrología e hidráulica</text><text x="20" y="70" fill="#94a3b8" font-size="16">propagación hasta la respuesta física</text></g>
  <g transform="translate(730 414)"><rect width="325" height="100" rx="16" fill="#102c31" stroke="#34d399"/><text x="20" y="40" fill="#6ee7b7" font-size="18" font-weight="800">Frecuencia sobre el impacto</text><text x="20" y="70" fill="#cbd5e1" font-size="16">caudal, calado, extensión o nivel</text></g>
  <g transform="translate(45 536)"><rect width="255" height="100" rx="16" fill="#2e2050" stroke="#a78bfa" stroke-width="2"/><text x="22" y="35" fill="#c4b5fd" font-size="17" font-weight="800">OE4 · TRANSFERENCIA</text><text x="22" y="68" fill="#e2e8f0" font-size="18">Validar reutilización</text></g>
  <g transform="translate(365 536)"><rect width="300" height="100" rx="16" fill="#27213f" stroke="#a78bfa"/><text x="20" y="40" fill="#f8fafc" font-size="19" font-weight="750">Ejecución y documentación</text><text x="20" y="70" fill="#94a3b8" font-size="16">misma arquitectura, otros dominios</text></g>
  <g transform="translate(730 536)"><rect width="325" height="100" rx="16" fill="#102c31" stroke="#34d399"/><text x="20" y="40" fill="#6ee7b7" font-size="18" font-weight="800">Transferencia comprobada</text><text x="20" y="70" fill="#cbd5e1" font-size="16">escala local, regional y nacional</text></g>
 </g>
 <g stroke="#5eead4" stroke-width="3" marker-end="url(#a)" fill="none"><path d="M310 220h43"/><path d="M675 220h43"/><path d="M310 342h43"/><path d="M675 342h43"/><path d="M310 464h43"/><path d="M675 464h43"/><path d="M310 586h43"/><path d="M675 586h43"/></g>
 <text x="550" y="687" text-anchor="middle" font-family="Inter,Arial" font-size="18" font-weight="750" fill="#ccfbf1">Objetivo → implementación → resultado verificable</text>
</svg>
