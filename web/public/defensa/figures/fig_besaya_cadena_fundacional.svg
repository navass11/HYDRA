<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Cadena fundacional del caso Besaya</title>
  <desc id="d">Proceso desde los aforos hasta el periodo de retorno estimado sobre el calado.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#5eead4"/></marker><linearGradient id="bg"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2030"/></linearGradient></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="56" y="70" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#f8fafc">Besaya 2018: la frecuencia se traslada al impacto</text>
  <text x="56" y="110" font-family="Inter,Arial,sans-serif" font-size="20" fill="#94a3b8">Cadena documentada en la aplicación fundacional</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(55 190)"><rect width="195" height="165" rx="18" fill="#102a43" stroke="#38bdf8" stroke-width="2"/><text x="98" y="48" text-anchor="middle" fill="#7dd3fc" font-size="19" font-weight="800">1 · AFOROS</text><text x="98" y="91" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="750">Caudal</text><text x="98" y="125" text-anchor="middle" fill="#cbd5e1" font-size="18">serie observada</text></g>
    <g transform="translate(285 190)"><rect width="210" height="165" rx="18" fill="#162945" stroke="#818cf8" stroke-width="2"/><text x="105" y="48" text-anchor="middle" fill="#a5b4fc" font-size="19" font-weight="800">2 · EVENTOS</text><text x="105" y="91" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="750">Pico · Volumen</text><text x="105" y="125" text-anchor="middle" fill="#cbd5e1" font-size="18">Duración</text></g>
    <g transform="translate(530 190)"><rect width="210" height="165" rx="18" fill="#20264a" stroke="#a78bfa" stroke-width="2"/><text x="105" y="48" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="800">3 · DEPENDENCIA</text><text x="105" y="91" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="750">Cópula</text><text x="105" y="125" text-anchor="middle" fill="#cbd5e1" font-size="18">gaussiana</text></g>
    <g transform="translate(775 190)"><rect width="175" height="165" rx="18" fill="#263018" stroke="#a3e635" stroke-width="2"/><text x="88" y="48" text-anchor="middle" fill="#bef264" font-size="19" font-weight="800">4 · ENSEMBLE</text><text x="88" y="91" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="750">Hidrogramas</text><text x="88" y="125" text-anchor="middle" fill="#cbd5e1" font-size="18">sintéticos</text></g>
    <g transform="translate(985 190)"><rect width="160" height="165" rx="18" fill="#3b2710" stroke="#f59e0b" stroke-width="2"/><text x="80" y="48" text-anchor="middle" fill="#fbbf24" font-size="19" font-weight="800">5 · IBER</text><text x="80" y="91" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="750">Calados</text><text x="80" y="125" text-anchor="middle" fill="#cbd5e1" font-size="18">y manchas</text></g>
  </g>
  <g stroke="#5eead4" stroke-width="5" marker-end="url(#a)" fill="none"><path d="M257 272h20"/><path d="M502 272h20"/><path d="M747 272h20"/><path d="M957 272h20"/></g>
  <rect x="225" y="440" width="750" height="115" rx="24" fill="#12342f" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="486" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#6ee7b7">RESULTADO DE DISEÑO</text>
  <text x="600" y="528" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#f8fafc">Periodo de retorno del calado: T(h)</text>
  <path d="M1065 366v45H600v20" stroke="#5eead4" stroke-width="5" marker-end="url(#a)" fill="none"/>
  <text x="600" y="624" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#ccfbf1">El retorno del caudal pico no se hereda directamente: se calcula sobre la respuesta hidráulica.</text>
</svg>
