<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t" font-family="Avenir Next, Avenir, Segoe UI, Helvetica, sans-serif">
  <title id="t">Cadena estocástica: de la serie observada a la frecuencia del impacto</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8E93"/></marker>
  </defs>

  <!-- 1 observed series -->
  <g transform="translate(10 20)">
    <rect width="230" height="210" fill="#F8FBFA" stroke="#C6D8D4"/>
    <rect width="230" height="6" fill="#8CC2BE"/>
    <text x="14" y="36" font-size="19" font-weight="600" fill="#13323A">1 Serie observada</text>
    <polyline points="16,170 30,160 42,166 54,140 66,162 78,150 90,168 102,120 114,158 126,150 138,164 150,96 162,152 174,160 186,138 198,166 212,150" fill="none" stroke="#13323A" stroke-width="2"/>
    <line x1="16" y1="182" x2="214" y2="182" stroke="#4A6870"/>
    <text x="14" y="202" font-size="15" fill="#4A6870">series cortas · extremos raros</text>
  </g>

  <line x1="246" y1="125" x2="276" y2="125" stroke="#3F8E93" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2 synthetic ensemble -->
  <g transform="translate(284 20)">
    <rect width="230" height="210" fill="#F8FBFA" stroke="#C6D8D4"/>
    <rect width="230" height="6" fill="#5FA3A4"/>
    <text x="14" y="36" font-size="19" font-weight="600" fill="#13323A">2 Miles de escenarios</text>
    <g fill="none" stroke="#5FA3A4" stroke-width="1.4" opacity=".55">
      <polyline points="16,168 40,150 64,160 88,118 112,150 136,138 160,90 184,146 212,140"/>
      <polyline points="16,160 40,166 64,140 88,150 112,110 136,160 160,130 184,120 212,158"/>
      <polyline points="16,172 40,140 64,168 88,132 112,156 136,96 160,150 184,162 212,128"/>
      <polyline points="16,150 40,162 64,128 88,166 112,140 136,150 160,70 184,140 212,160"/>
      <polyline points="16,166 40,154 64,150 88,104 112,164 136,128 160,148 184,100 212,150"/>
      <polyline points="16,156 40,170 64,160 88,142 112,126 136,166 160,118 184,154 212,112"/>
    </g>
    <line x1="16" y1="182" x2="214" y2="182" stroke="#4A6870"/>
    <text x="14" y="202" font-size="15" fill="#4A6870">clima y dependencia</text>
  </g>

  <line x1="520" y1="125" x2="550" y2="125" stroke="#3F8E93" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3 physical models -->
  <g transform="translate(558 20)">
    <rect width="232" height="210" fill="#F8FBFA" stroke="#C6D8D4"/>
    <rect width="232" height="6" fill="#3F8E93"/>
    <text x="14" y="36" font-size="19" font-weight="600" fill="#13323A">3 Modelos físicos</text>
    <path d="M20 170 L70 74 L118 120 L160 64 L212 170 Z" fill="#E4EEEB" stroke="#13323A" stroke-width="1.5"/>
    <path d="M70 74 C90 120 110 140 118 168 M160 64 C140 110 124 140 120 168" fill="none" stroke="#3F8E93" stroke-width="4" stroke-linecap="round"/>
    <text x="14" y="202" font-size="15" fill="#4A6870">lluvia → caudal → calado</text>
  </g>

  <path d="M674 236 V262 H126 V286" fill="none" stroke="#3F8E93" stroke-width="3" marker-end="url(#a)"/>

  <!-- 4 depth per scenario -->
  <g transform="translate(10 294)">
    <rect width="300" height="250" fill="#F8FBFA" stroke="#C6D8D4"/>
    <rect width="300" height="6" fill="#23697A"/>
    <text x="14" y="36" font-size="19" font-weight="600" fill="#13323A">4 Calado en cada escenario</text>
    <g transform="translate(20 54)">
      <g fill="#E4EEEB"><rect width="260" height="150"/></g>
      <path d="M0 70 C60 60 90 90 140 80 C190 70 220 90 260 84 V110 C220 116 190 98 140 108 C90 118 60 92 0 100 Z" fill="#0E4A57"/>
      <path d="M0 52 C60 44 90 70 140 62 C190 52 220 70 260 66 V84 C220 90 190 70 140 80 C90 90 60 60 0 70 Z" fill="#3F8E93"/>
      <path d="M0 40 C60 30 90 58 140 48 C190 40 220 58 260 54 V66 C220 70 190 52 140 62 C90 70 60 44 0 52 Z" fill="#A9D2CC"/>
      <path d="M0 100 C60 92 90 118 140 108 C190 98 220 116 260 110 V124 C220 130 190 112 140 122 C90 132 60 106 0 114 Z" fill="#3F8E93"/>
      <path d="M0 114 C60 106 90 132 140 122 C190 112 220 130 260 124 V134 C220 140 190 124 140 134 C90 142 60 118 0 126 Z" fill="#A9D2CC"/>
    </g>
    <text x="14" y="232" font-size="15" fill="#4A6870">un mapa por escenario simulado</text>
  </g>

  <line x1="316" y1="420" x2="346" y2="420" stroke="#3F8E93" stroke-width="3" marker-end="url(#a)"/>

  <!-- 5 impact frequency -->
  <g transform="translate(354 294)">
    <rect width="436" height="250" fill="#F8FBFA" stroke="#C6D8D4"/>
    <rect width="436" height="6" fill="#0E4A57"/>
    <text x="14" y="36" font-size="19" font-weight="600" fill="#13323A">5 Frecuencia sobre el impacto</text>
    <g transform="translate(58 56)">
      <path d="M0 140 C80 118 160 88 240 54 C290 34 330 16 350 8 L350 40 C330 52 290 70 240 88 C160 118 80 136 0 150 Z" fill="#A9D2CC" opacity=".7"/>
      <path d="M0 145 C80 127 160 103 240 71 C290 52 330 34 350 24" fill="none" stroke="#0E4A57" stroke-width="3"/>
      <g fill="#13323A"><circle cx="20" cy="142" r="3"/><circle cx="70" cy="132" r="3"/><circle cx="120" cy="118" r="3"/><circle cx="170" cy="100" r="3"/><circle cx="215" cy="84" r="3"/><circle cx="262" cy="60" r="3"/></g>
      <line x1="0" y1="160" x2="350" y2="160" stroke="#4A6870"/>
      <line x1="0" y1="0" x2="0" y2="160" stroke="#4A6870"/>
      <text x="175" y="182" font-size="15" fill="#4A6870" text-anchor="middle">período de retorno del calado (años, escala log)</text>
      <text x="-14" y="80" font-size="15" fill="#4A6870" text-anchor="middle" transform="rotate(-90 -14 80)">calado</text>
    </g>
  </g>
</svg>
