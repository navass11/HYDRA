<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
 <title id="t">Trayectoria científica de la tesis</title><desc id="d">Línea temporal desde el TFM del Besaya hasta pyhydra e HYDRA.</desc>
 <defs><linearGradient id="bg"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2030"/></linearGradient><linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
 <rect width="1100" height="720" rx="28" fill="url(#bg)"/>
 <text x="52" y="65" font-family="Inter,Arial" font-size="30" font-weight="850" fill="#f8fafc">Una metodología que madura hasta convertirse en infraestructura</text>
 <text x="52" y="103" font-family="Inter,Arial" font-size="18" fill="#94a3b8">Publicación, contraste externo y transferencia acumulada entre 2017 y 2026</text>
 <path d="M100 360H1000" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
 <g font-family="Inter,Arial">
  <g transform="translate(120 360)"><circle r="20" fill="#38bdf8" stroke="#bae6fd" stroke-width="4"/><text x="0" y="-52" text-anchor="middle" fill="#7dd3fc" font-size="21" font-weight="900">2017</text><rect x="-85" y="35" width="170" height="120" rx="16" fill="#102a43" stroke="#38bdf8"/><text x="0" y="68" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">TFM Besaya</text><text x="0" y="97" text-anchor="middle" fill="#cbd5e1" font-size="15">V Jornadas</text><text x="0" y="122" text-anchor="middle" fill="#94a3b8" font-size="14">nace la cadena</text></g>
  <g transform="translate(295 360)"><circle r="20" fill="#22d3ee" stroke="#cffafe" stroke-width="4"/><text x="0" y="-52" text-anchor="middle" fill="#67e8f9" font-size="21" font-weight="900">2018–19</text><rect x="-85" y="-195" width="170" height="120" rx="16" fill="#10303d" stroke="#22d3ee"/><text x="0" y="-161" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">ROP + Mallorca</text><text x="0" y="-132" text-anchor="middle" fill="#cbd5e1" font-size="15">aplicación real</text><text x="0" y="-107" text-anchor="middle" fill="#94a3b8" font-size="14">downscaling</text></g>
  <g transform="translate(475 360)"><circle r="20" fill="#2dd4bf" stroke="#ccfbf1" stroke-width="4"/><text x="0" y="-52" text-anchor="middle" fill="#5eead4" font-size="21" font-weight="900">2019–23</text><rect x="-85" y="35" width="170" height="120" rx="16" fill="#12342f" stroke="#2dd4bf"/><text x="0" y="68" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">Andes + IAHR</text><text x="0" y="97" text-anchor="middle" fill="#cbd5e1" font-size="15">NEOPRENE</text><text x="0" y="122" text-anchor="middle" fill="#94a3b8" font-size="14">escala y clima</text></g>
  <g transform="translate(655 360)"><circle r="20" fill="#34d399" stroke="#d1fae5" stroke-width="4"/><text x="0" y="-52" text-anchor="middle" fill="#6ee7b7" font-size="21" font-weight="900">2024</text><rect x="-85" y="-195" width="170" height="120" rx="16" fill="#12342f" stroke="#34d399"/><text x="0" y="-161" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">Calle 30</text><text x="0" y="-132" text-anchor="middle" fill="#cbd5e1" font-size="15">artículo + EGU</text><text x="0" y="-107" text-anchor="middle" fill="#94a3b8" font-size="14">cadena industrial</text></g>
  <g transform="translate(825 360)"><circle r="20" fill="#818cf8" stroke="#e0e7ff" stroke-width="4"/><text x="0" y="-52" text-anchor="middle" fill="#a5b4fc" font-size="21" font-weight="900">2025</text><rect x="-85" y="35" width="170" height="120" rx="16" fill="#22264b" stroke="#818cf8"/><text x="0" y="67" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="800">SIMPCCe</text><text x="0" y="94" text-anchor="middle" fill="#cbd5e1" font-size="15">Valencia · Tanganica</text><text x="0" y="121" text-anchor="middle" fill="#94a3b8" font-size="14">Besaya rugosidad</text></g>
  <g transform="translate(985 360)"><circle r="24" fill="#a78bfa" stroke="#ede9fe" stroke-width="5"/><text x="0" y="-52" text-anchor="middle" fill="#c4b5fd" font-size="21" font-weight="900">2026</text><rect x="-90" y="-195" width="180" height="120" rx="16" fill="#2e2050" stroke="#a78bfa" stroke-width="2"/><text x="0" y="-159" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="850">pyhydra</text><text x="0" y="-130" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="850">+ HYDRA</text><text x="0" y="-102" text-anchor="middle" fill="#ddd6fe" font-size="14">software versionado</text></g>
 </g>
 <rect x="210" y="615" width="680" height="50" rx="25" fill="#0f3b3b" stroke="#2dd4bf"/><text x="550" y="647" text-anchor="middle" font-family="Inter,Arial" font-size="19" font-weight="800" fill="#ccfbf1">Concepto → casos → publicaciones → arquitectura reproducible</text>
