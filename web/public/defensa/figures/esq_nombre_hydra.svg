<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc"><title id="title">De los objetivos a pyhydra e HYDRA</title><desc id="desc">Las hipótesis y los objetivos fijan los requisitos. pyhydra es el núcleo científico en Python que responde a ellos. HYDRA integra el núcleo con web, notebooks y servicios. La hidra representa funciones especializadas coordinadas.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#397b80" stroke-width="1.8"/></marker></defs><rect x="1" y="1" width="1298" height="898" rx="18" fill="#fff" stroke="#c5dbd7"/><g font-family="Arial, sans-serif" fill="#203d47"><text x="45" y="68" font-size="40" font-weight="700">La respuesta tecnológica a los requisitos</text><rect x="45" y="125" width="705" height="160" rx="10" fill="#eff6f4" stroke="#91b4b1"/><text x="72" y="171" font-size="36" font-weight="700">Hipótesis y objetivos</text><text x="72" y="214" font-size="29">Automatizar, organizar en módulos</text><text x="72" y="250" font-size="29">y poder repetir el análisis.</text><path d="M397 299v37" stroke="#397b80" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="350" width="705" height="160" rx="10" fill="#eff6f4" stroke="#91b4b1"/><text x="72" y="396" font-size="36" font-weight="700">pyhydra</text><text x="72" y="439" font-size="29">Librería de Python:</text><text x="72" y="475" font-size="29">implementación del núcleo científico.</text><path d="M397 524v37" stroke="#397b80" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="575" width="705" height="160" rx="10" fill="#eff6f4" stroke="#91b4b1"/><text x="72" y="621" font-size="36" font-weight="700">HYDRA</text><text x="72" y="664" font-size="29">Plataforma: núcleo + web</text><text x="72" y="700" font-size="29">+ notebooks + servicios de ejecución.</text><image x="825" y="165" width="405" height="405" href="data:image/svg+xml;base64,"/><text x="1027" y="628" text-anchor="middle" font-size="31" font-weight="700">Funciones especializadas</text><text x="1027" y="671" text-anchor="middle" font-size="31">Un sistema coordinado</text><path d="M45 789H1255" stroke="#c5dbd7"/><text x="650" y="848" text-anchor="middle" font-size="32" font-weight="700">Integración · Reproducibilidad · Transferencia</text></g></svg>