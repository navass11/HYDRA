<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t" font-family="Avenir Next, Avenir, Segoe UI, Helvetica, sans-serif">
  <title id="t">La cadena completa que la pregunta exige automatizar, conservando la incertidumbre hasta el impacto</title>
  <defs>
    <linearGradient id="fan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#A9D2CC" stop-opacity=".25"/><stop offset="1" stop-color="#0E4A57" stop-opacity=".55"/></linearGradient>
  </defs>

  <!-- uncertainty fan -->
  <path d="M608 46 L632 46 L700 560 L540 560 Z" fill="url(#fan)"/>
  <text x="620" y="590" font-size="15" fill="#4A6870" text-anchor="middle">incertidumbre propagada</text>

  <!-- spine -->
  <line x1="70" y1="80" x2="70" y2="520" stroke="#C6D8D4" stroke-width="8" stroke-linecap="round"/>

  <!-- 1 climate data -->
  <g transform="translate(0 20)">
    <circle cx="70" cy="60" r="56" fill="#F8FBFA" stroke="#8CC2BE" stroke-width="5"/>
    <path d="M42 66 a14 14 0 0 1 4 -27 a20 20 0 0 1 38 -4 a14 14 0 0 1 10 31 Z" fill="none" stroke="#0E4A57" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="#3F8E93" stroke-width="4" stroke-linecap="round"><path d="M52 76 l-5 12M70 76 l-5 12M88 76 l-5 12"/></g>
    <text x="150" y="52" font-size="26" font-weight="600" fill="#13323A">Datos climáticos</text>
    <text x="150" y="82" font-size="18" fill="#4A6870">observaciones y proyecciones,</text>
    <text x="150" y="106" font-size="18" fill="#4A6870">con su incertidumbre</text>
  </g>

  <!-- 2 automated chain -->
  <g transform="translate(0 150)">
    <circle cx="70" cy="60" r="56" fill="#F8FBFA" stroke="#3F8E93" stroke-width="5"/>
    <path d="M44 60 a26 26 0 0 1 44 -19" fill="none" stroke="#0E4A57" stroke-width="5" stroke-linecap="round"/>
    <path d="M84 30 l6 12 l-13 2" fill="none" stroke="#0E4A57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 60 a26 26 0 0 1 -44 19" fill="none" stroke="#0E4A57" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 90 l-6 -12 l13 -2" fill="none" stroke="#0E4A57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="52" font-size="26" font-weight="600" fill="#0E4A57">Cadena automática</text>
    <text x="150" y="82" font-size="18" fill="#4A6870">mismas entradas y configuración,</text>
    <text x="150" y="106" font-size="18" fill="#4A6870">mismo resultado</text>
  </g>

  <!-- 3 physical models -->
  <g transform="translate(0 280)">
    <circle cx="70" cy="60" r="56" fill="#F8FBFA" stroke="#23697A" stroke-width="5"/>
    <path d="M30 44 H48 L60 76 H82 L94 44 H112" fill="none" stroke="#0E4A57" stroke-width="4" stroke-linejoin="round"/>
    <path d="M54 60 L60 76 H82 L88 60 Z" fill="#3F8E93"/>
    <text x="150" y="52" font-size="26" font-weight="600" fill="#13323A">Modelos físicos</text>
    <text x="150" y="82" font-size="18" fill="#4A6870">lluvia en caudal y caudal en calado,</text>
    <text x="150" y="106" font-size="18" fill="#4A6870">con el motor adecuado a cada caso</text>
  </g>

  <!-- 4 real project -->
  <g transform="translate(0 410)">
    <circle cx="70" cy="60" r="56" fill="#F8FBFA" stroke="#0E4A57" stroke-width="5"/>
    <path d="M38 92 V58 a32 32 0 0 1 64 0 V92" fill="none" stroke="#0E4A57" stroke-width="5"/>
    <path d="M52 92 V62 a18 18 0 0 1 36 0 V92" fill="none" stroke="#0E4A57" stroke-width="3"/>
    <path d="M52 92 V82 H88 V92 Z" fill="#B5334B"/>
    <text x="150" y="52" font-size="26" font-weight="600" fill="#13323A">Proyecto real</text>
    <text x="150" y="82" font-size="18" fill="#4A6870">la frecuencia se decide sobre el</text>
    <text x="150" y="106" font-size="18" fill="#4A6870">impacto: calado, extensión o nivel</text>
  </g>
</svg>
