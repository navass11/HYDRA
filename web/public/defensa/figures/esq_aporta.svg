<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t" font-family="Avenir Next, Avenir, Segoe UI, Helvetica, sans-serif">
  <title id="t">Integración, reproducibilidad y transferencia</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8E93"/></marker></defs>

  <!-- integration -->
  <text x="10" y="28" font-size="19" font-weight="600" fill="#13323A">Integración: una sola cadena</text>
  <g transform="translate(10 44)" font-size="15" font-weight="600" text-anchor="middle">
    <rect width="140" height="54" fill="#8CC2BE"/><text x="70" y="33" fill="#13323A">Datos</text>
    <rect x="160" width="140" height="54" fill="#5FA3A4"/><text x="230" y="33" fill="#fff">Extremos</text>
    <rect x="320" width="140" height="54" fill="#3F8E93"/><text x="390" y="33" fill="#fff">Escenarios</text>
    <rect x="480" width="140" height="54" fill="#23697A"/><text x="550" y="33" fill="#fff">Modelos</text>
    <rect x="640" width="140" height="54" fill="#0E4A57"/><text x="710" y="33" fill="#fff">Impacto</text>
  </g>
  <g stroke="#13323A" stroke-width="2"><path d="M150 71h10M310 71h10M470 71h10M630 71h10"/></g>

  <!-- reproducibility: record card -->
  <text x="10" y="150" font-size="19" font-weight="600" fill="#13323A">Reproducibilidad: cada resultado deja registro</text>
  <g transform="translate(10 166)">
    <rect width="380" height="176" fill="#F8FBFA" stroke="#C6D8D4"/><rect width="6" height="176" fill="#0E4A57"/>
    <g font-size="16" fill="#13323A">
      <text x="24" y="36" font-weight="600">Fuente</text><text x="140" y="36" fill="#4A6870">ERA5, consulta y fecha</text>
      <text x="24" y="72" font-weight="600">Método</text><text x="140" y="72" fill="#4A6870">GEV bayesiana, priors</text>
      <text x="24" y="108" font-weight="600">Configuración</text><text x="140" y="108" fill="#4A6870">versión y parámetros</text>
      <text x="24" y="144" font-weight="600">Salida</text><text x="140" y="144" fill="#4A6870">NetCDF, GeoTIFF</text>
    </g>
    <g stroke="#C6D8D4"><path d="M24 50H360M24 86H360M24 122H360"/></g>
  </g>
  <g transform="translate(410 166)" font-size="16" fill="#4A6870">
    <text y="30">Mismos datos y configuración</text>
    <text y="56">producen el mismo resultado,</text>
    <text y="82">también fuera del equipo</text>
    <text y="108">que lo calculó.</text>
  </g>

  <!-- transfer -->
  <text x="10" y="390" font-size="19" font-weight="600" fill="#13323A">Transferencia: el mismo núcleo, problemas distintos</text>
  <g transform="translate(10 404)">
    <rect x="0" y="40" width="150" height="72" fill="#0E4A57"/><text x="75" y="82" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">pyhydra</text>
    <g fill="none" stroke="#3F8E93" stroke-width="2.5">
      <path d="M154 76 C230 76 230 18 300 18" marker-end="url(#a)"/>
      <path d="M154 76 C230 76 230 76 300 76" marker-end="url(#a)"/>
      <path d="M154 76 C230 76 230 134 300 134" marker-end="url(#a)"/>
    </g>
    <g font-size="15" fill="#13323A">
      <rect x="306" y="0" width="474" height="36" fill="#DCEBE8"/><text x="320" y="24">Infraestructura urbana: Calle 30</text>
      <rect x="306" y="58" width="474" height="36" fill="#DCEBE8"/><text x="320" y="82">Extremos tras un evento sin precedente: Valencia</text>
      <rect x="306" y="116" width="474" height="36" fill="#DCEBE8"/><text x="320" y="140">Escala nacional: Panamá y SIMPCCe</text>
    </g>
  </g>
</svg>
